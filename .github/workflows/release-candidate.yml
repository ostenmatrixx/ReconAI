name: Release candidate integrity

run-name: Non-publishing release candidate for ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD-NON-PUBLISHING-CANDIDATE to construct signed local archives
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Attest non-publishing ${{ matrix.service }} candidate
    if:
      ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'BUILD-NON-PUBLISHING-CANDIDATE'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CANDIDATE_DIRECTORY: artifacts/release-candidate/${{ matrix.service }}
      OCI_ARCHIVE: artifacts/release-candidate/${{ matrix.service }}/image.oci.tar
      OCI_LAYOUT: ${{ runner.temp }}/reconai-${{ matrix.service }}-oci-layout
      IMAGE_SBOM: artifacts/release-candidate/${{ matrix.service }}/image.cdx.json
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare candidate directory
        run: mkdir -p "${CANDIDATE_DIRECTORY}"
      - name: Build local OCI archive with attestations
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          outputs: type=oci,dest=${{ env.OCI_ARCHIVE }}
          provenance: mode=max
          sbom: true
          tags: reconai/${{ matrix.service }}:${{ github.sha }}
      - name: Extract bounded OCI layout for scanner compatibility
        run: |
          mkdir -p "${OCI_LAYOUT}"
          tar -xf "${OCI_ARCHIVE}" -C "${OCI_LAYOUT}"
      - name: Gate candidate vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Explicit post-incident scanner pin; do not inherit the action default.
          version: v0.72.0
          input: ${{ env.OCI_LAYOUT }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate candidate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ env.OCI_LAYOUT }}
          format: cyclonedx
          output: ${{ env.IMAGE_SBOM }}
          exit-code: 0
          skip-setup-trivy: true
      - name: Create checksum manifest
        working-directory: ${{ env.CANDIDATE_DIRECTORY }}
        run: |
          sha256sum image.oci.tar image.cdx.json > SHA256SUMS
      - name: Sign candidate build provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ env.CANDIDATE_DIRECTORY }}/SHA256SUMS
      - name: Sign candidate SBOM attestation
        id: sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ env.OCI_ARCHIVE }}
          sbom-path: ${{ env.IMAGE_SBOM }}
      - name: Preserve candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconai-${{ matrix.service }}-${{ github.sha }}-candidate
          path: |
            ${{ env.CANDIDATE_DIRECTORY }}
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.sbom-attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
