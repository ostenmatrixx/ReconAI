min_version: 2.1.10

pre-commit:
  # pnpm may reconcile frozen dependency links before a command. Keep hook commands sequential so
  # lifecycle preparation cannot race while replacing Git hooks or workspace binary links.
  parallel: false
  commands:
    staged-policy:
      run: node scripts/check-staged-files.mjs
    secrets:
      glob: "*.{js,mjs,cjs,ts,tsx,json,yml,yaml,md,css,sql,env}"
      run: corepack pnpm exec secretlint {staged_files} --maskSecrets
    format:
      glob: "*.{js,mjs,cjs,ts,tsx,json,yml,yaml,md,css,sql}"
      run: corepack pnpm exec prettier --check {staged_files}
    lint:
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: corepack pnpm exec eslint --max-warnings=0 {staged_files}
    config:
      glob: "*.{json,yml,yaml}"
      run: corepack pnpm config:check

commit-msg:
  commands:
    conventional:
      run: node scripts/validate-commit-message.mjs {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: corepack pnpm typecheck
    tests:
      run: corepack pnpm test
    reconciliation:
      run: corepack pnpm test:reconciliation
    tenant:
      run: corepack pnpm test:tenant
    migrations:
      run: corepack pnpm migrations:check
    schemas:
      run: corepack pnpm schemas:check
    dependencies:
      run: corepack pnpm dependency:policy
