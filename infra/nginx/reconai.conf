limit_req_zone $binary_remote_addr zone=reconai_api_per_ip:10m rate=20r/s;

log_format reconai_access escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","client_ip":"$remote_addr",'
  '"method":"$request_method","path":"$uri","protocol":"$server_protocol",'
  '"status":$status,"response_bytes":$body_bytes_sent,"request_seconds":$request_time}';
access_log /var/log/nginx/access.log reconai_access;

upstream reconai_web {
  server web:3000;
  keepalive 16;
}

upstream reconai_api {
  server api:4000;
  keepalive 32;
}

server {
  listen 8088;
  server_name _;
  server_tokens off;

  client_max_body_size 12m;
  client_body_timeout 15s;
  keepalive_timeout 30s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-Frame-Options "DENY" always;

  location /api/ {
    limit_req zone=reconai_api_per_ip burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://reconai_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the public trust boundary: discard any client-selected forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID $request_id;
    proxy_request_buffering on;
  }

  location /v1/ {
    limit_req zone=reconai_api_per_ip burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://reconai_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the public trust boundary: discard any client-selected forwarding chain.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID $request_id;
    proxy_request_buffering on;
  }

  location / {
    proxy_pass http://reconai_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Request-ID $request_id;
  }
}
