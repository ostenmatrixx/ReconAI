name: Bug report
description: Report a reproducible non-security defect using synthetic data
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value:
        "Do not report vulnerabilities, credentials, customer data, or production payloads here. Use
        SECURITY.md."
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual outcome
      description: Include the affected tenant-safe workflow and visible error.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include version/commit, commands, and sanitized output.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          web,
          API,
          worker,
          database/migration,
          reconciliation,
          Shopify,
          Stripe,
          CSV,
          auth/permissions,
          observability,
          documentation,
        ]
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label:
            I removed credentials, customer data, production payloads, and sensitive security
            details.
          required: true
        - label: This is not a private security report.
          required: true
